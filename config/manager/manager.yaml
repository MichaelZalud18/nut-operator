apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  annotations:
    checkov.io/skip1: CKV_K8S_43=Base manager image is replaced by Kustomize, release workflows, or GitOps overlays; production deployments use immutable digests.
    checkov.io/skip2: CKV_K8S_38=The controller manager requires a Kubernetes API service account token to reconcile CRDs and owned resources.
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: nut-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: nut-operator
    spec:
      automountServiceAccountToken: true
      # The manager is a tier 0 workload: it must not be evicted, drained, or scaled down by a
      # ShutdownFlow it is itself executing (F-30). Every operand this manager renders gets a
      # priority class (system-cluster-critical for NUTServer, system-node-critical for
      # NodePowerAgent) -- the manager needs the same protection against preemption/eviction under
      # node pressure that it already gives everything it creates.
      priorityClassName: system-cluster-critical
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:main
        # IfNotPresent, not Always: the e2e suite builds the image and `kind load`s it locally with no
        # registry involved, and Always forces a pull against the placeholder tag that does not exist
        # (guaranteed ImagePullBackOff). Freshness is not what this setting buys here -- every real
        # deployment overrides the image with an explicit digest via Kustomize, and a pinned digest is
        # content-verified regardless of pull policy. CKV_K8S_15 is suppressed for this reason.
        imagePullPolicy: IfNotPresent
        name: manager
        env:
          # Lets the executor (internal/kubeactions.Runner) recognize and refuse to evict, drain, or
          # scale itself as part of a ShutdownFlow it is executing (F-30) -- the same self-exclusion
          # protection F-14 already gives NodePowerAgent operand namespaces, extended to the manager's
          # own namespace.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10

---
apiVersion: power.zalud.io/v1alpha1
kind: NUTServer
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
  name: rack-a
spec:
  managementClusterRef:
    name: production
  namespace: power-system
  deviceSelector:
    matchLabels:
      power.zalud.io/domain: rack-a
  image:
    repository: ghcr.io/michaelzalud18/nut-server
    tag: main
    pullPolicy: IfNotPresent
  placement:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
  auth:
    mode: OperatorManaged
    perNodeUsers: true
  tls:
    mode: Required
    # kubernetes.io/tls Secret: tls.crt + tls.key. The operand assembles NUT's CERTFILE from it.
    serverCertificateRef:
      namespace: power-system
      name: rack-a-nut-server-tls
    # CA the agents verify this server against, rendered as CERTPATH in upsmon.conf. Without it
    # agents encrypt but cannot authenticate upsd, and report a NUTTLSDowngraded condition.
    serverCARef:
      namespace: power-system
      name: rack-a-nut-server-ca
    # verifyClientCertificates (CERTREQUEST) is left off: the operator does not issue client
    # certificates to upsmon, and NUT honors CERTREQUEST under OpenSSL only from 2.8.6 onward.
  service:
    type: ClusterIP
    port: 3493

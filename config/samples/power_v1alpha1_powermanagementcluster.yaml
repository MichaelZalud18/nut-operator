---
apiVersion: power.zalud.io/v1alpha1
kind: PowerManagementCluster
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
  name: production
spec:
  operandNamespace:
    name: power-system
    create: true
  shutdownTiers:
    labelKey: power.zalud.io/shutdown-tier
    defaultTier: 4
    tiers:
      - tier: 0
        name: last-ditch
        description: Workloads that stop only when their node powers off.
      - tier: 1
        name: final-node-release
        description: Final orchestrated node shutdown.
      - tier: 2
        name: infrastructure
        description: Storage and infrastructure actions that run late.
      - tier: 3
        name: data
        description: Databases and stateful application backends.
      - tier: 4
        name: applications
        description: Ordinary application workloads.
  storage:
    mode: CNPG
    cnpg:
      clusterRef:
        namespace: power-system
        name: power-audit
      database: power
      schema: power
  hooks:
    defaultTimeout: 10s
    allowedEndpoints:
      - scheme: https
        host: hooks.example.test
        pathPrefix: /power
  images:
    nutServer:
      repository: ghcr.io/michaelzalud18/nut-server
      tag: main
      pullPolicy: IfNotPresent
    upsmonAgent:
      repository: ghcr.io/michaelzalud18/upsmon-agent
      tag: main
      pullPolicy: IfNotPresent
    actuator:
      repository: ghcr.io/michaelzalud18/node-actuator
      tag: main
      pullPolicy: IfNotPresent
  security:
    profile: Restricted
    requireExplicitActuation: true
    allowedActuatorNamespaces:
      - power-system
  observability:
    serviceMonitor: true
    kubernetesEvents: true

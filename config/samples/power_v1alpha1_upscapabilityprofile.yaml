apiVersion: power.zalud.io/v1alpha1
kind: UPSCapabilityProfile
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
  name: example-snmp-ups-profile
spec:
  version: "0.1.0"
  selector:
    driverFamily: snmp-ups
  telemetry:
    variables:
      - ups.status
      - battery.charge
      - battery.runtime
      - input.voltage
      - output.voltage
  # Quirks are objects, not bare names, so they can expire (OD-22). A bare string cannot say which
  # firmware actually has the defect, which is how a device on a fixed build inherits its model
  # family's entire history permanently (F-26).
  quirks:
    - name: reports-stale-runtime-on-transfer
      description: Runtime stays at its pre-transfer value for one poll after switching to battery.
      firmware:
        below: "2.4.0"

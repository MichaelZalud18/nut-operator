---
apiVersion: power.zalud.io/v1alpha1
kind: ShutdownFlow
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
  name: rack-a-conservation
spec:
  managementClusterRef:
    name: production
  mode: DryRun
  triggers:
    - type: OnBattery
      powerDomains:
        - rack-a
      for: 2m
    - type: RuntimeBelow
      powerDomains:
        - rack-a
      runtimeBelowSeconds: 1200
  groups:
    - name: notify-on-battery
      action: Notify
      description: Emit the initial power event before disruptive actions.
      before:
        - wait-for-transfer-clear
      params:
        severity: warning
    - name: wait-for-transfer-clear
      action: Wait
      description: Wait for short transfers to clear.
      before:
        - application-workloads
      timeout: 2m
    - name: application-workloads
      action: ScaleWorkload
      description: Scale non-critical apps before node drain.
      shutdownTier: 4
      params:
        replicas: "0"
      target:
        namespaceSelector:
          matchLabels:
            power.zalud.io/shutdown-tier: "4"
      before:
        - flush-storage
      timeout: 5m
    - name: flush-storage
      action: RunHook
      description: Ask an external storage system to flush before node drain.
      shutdownTier: 2
      hookRef:
        namespace: power-system
        name: flush-storage
      before:
        - cordon-standard-workers
      timeout: 15s
    - name: cordon-standard-workers
      action: CordonNodes
      shutdownTier: 2
      target:
        nodeSelector:
          matchLabels:
            power.zalud.io/node-group: standard
      before:
        - drain-standard-workers
      timeout: 1m
    - name: drain-standard-workers
      action: DrainNodes
      shutdownTier: 2
      target:
        nodeSelector:
          matchLabels:
            power.zalud.io/node-group: standard
      before:
        - request-agent-shutdown
      timeout: 10m
    - name: request-agent-shutdown
      action: AgentShutdown
      shutdownTier: 1
      target:
        agentRefs:
          - name: rack-a-workers
      timeout: 5m
  concurrencyPolicy: Forbid
  abortPolicy:
    behavior: HaltAndSurface
    notify: true
  safety:
    requireManualApproval: true
    approvalAnnotation: power.zalud.io/approved-for-enforce
    maxEstimatedDuration: 20m

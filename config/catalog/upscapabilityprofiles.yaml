---
apiVersion: power.zalud.io/v1alpha1
kind: UPSCapabilityProfile
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/component: capability-catalog
    app.kubernetes.io/managed-by: kustomize
    power.zalud.io/catalog: bundled
    power.zalud.io/vendor: nut
  name: nut-bundled-unidentified-device
spec:
  version: "1.0.0"
  selector:
    universal: true
  telemetry:
    variables:
      - ups.status
---
apiVersion: power.zalud.io/v1alpha1
kind: UPSCapabilityProfile
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/component: capability-catalog
    app.kubernetes.io/managed-by: kustomize
    power.zalud.io/catalog: bundled
    power.zalud.io/vendor: ubiquiti
  name: ubiquiti-unifi-ups-tower
spec:
  version: "1.0.0"
  selector:
    modelGlob: TOWER_*VA_*V
  telemetry:
    variables:
      - battery.charge
      - battery.charge.low
      - battery.low
      - battery.runtime
      - battery.voltage
      - input.frequency
      - input.transfer.high
      - input.transfer.low
      - input.voltage
      - input.voltage.nominal
      - output.current
      - output.frequency
      - output.power
      - output.power.nominal
      - output.voltage
      - ups.id
      - ups.load
      - ups.mfr
      - ups.model
      - ups.serial
      - ups.status
      - ups.test.date
      - ups.test.interval
      - ups.test.result
      - ups.type
      - ups.temperature
    aliases:
      battery.low: battery.charge.low
  quirks:
    - built-in-nut-server-not-reachable-on-firmware-1.6.1
    - snmpv3-only-no-community-string-on-firmware-1.6.1
    - firmware-before-1.4.18-had-nut-protocol-response-bugs
    - instant-commands-not-confirmed
    - reports-battery.low-instead-of-battery.charge.low
    - credentialed-upsc-reads-may-require-client-config
    - tower-output-power-and-current-may-be-firmware-or-load-dependent
---

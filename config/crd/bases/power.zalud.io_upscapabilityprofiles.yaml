---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: upscapabilityprofiles.power.zalud.io
spec:
  group: power.zalud.io
  names:
    kind: UPSCapabilityProfile
    listKind: UPSCapabilityProfileList
    plural: upscapabilityprofiles
    singular: upscapabilityprofile
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UPSCapabilityProfile is the Schema for the upscapabilityprofiles
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of UPSCapabilityProfile
            properties:
              actuation:
                description: actuation declares authoritative UPS control behaviors
                  exposed by matching devices.
                properties:
                  behaviors:
                    description: behaviors are authoritative actuation behavior identifiers.
                    items:
                      type: string
                    type: array
                type: object
              quirks:
                description: quirks records behavior-affecting quirks consumed by
                  planner or executor policy.
                items:
                  description: |-
                    CapabilityQuirk declares a behavior-affecting device defect, optionally scoped
                    to the firmware that actually has it (OD-22).

                    A bare name cannot expire. The bundled catalog used to carry scope inside the
                    string -- "built-in-nut-server-not-reachable-on-firmware-1.6.1" -- which reads
                    correctly to a human and enforces nothing, so a device on newer firmware
                    inherited every historical defect of its model family permanently (F-26).
                  properties:
                    firmware:
                      description: |-
                        firmware limits this quirk to the firmware versions that have it. Omitted
                        means the quirk applies to every device the profile matches, which stays
                        the default because most quirks are properties of a model rather than of a
                        build.
                      properties:
                        below:
                          description: |-
                            below applies the quirk to firmware strictly below this dotted-numeric
                            version, for defects with a known fix release. Only dotted-numeric firmware
                            can be compared; a device whose firmware cannot be placed keeps the quirk
                            and the condition says so, because the alternative is dropping a real defect
                            on a guess.
                          pattern: ^[0-9]+(\.[0-9]+)*$
                          type: string
                        matches:
                          description: |-
                            matches are glob patterns compared against the device's reported firmware.
                            Globs rather than ranges, because vendor firmware strings are not generally
                            orderable: "1.6.1" looks like a version and "EL-2.3b" does not, and
                            pretending otherwise mis-scopes silently.
                          items:
                            type: string
                          type: array
                      type: object
                    name:
                      description: |-
                        name identifies the quirk. It describes the defect only; firmware scope
                        belongs in the firmware field, where the matcher can act on it.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              selector:
                description: selector declares which UPS devices this profile can
                  match.
                properties:
                  driverFamily:
                    description: driverFamily matches the NUT driver family, such
                      as snmp-ups.
                    type: string
                  firmware:
                    description: firmware narrows an exact model match to a specific
                      firmware string.
                    type: string
                  model:
                    description: model matches an exact provider model string.
                    type: string
                  modelGlob:
                    description: modelGlob matches a provider model string using path.Match
                      glob semantics.
                    type: string
                  universal:
                    default: false
                    description: universal marks this profile as the unidentified-device
                      fallback.
                    type: boolean
                type: object
              telemetry:
                description: telemetry declares authoritative NUT variables exposed
                  by matching devices.
                properties:
                  aliases:
                    additionalProperties:
                      type: string
                    description: |-
                      aliases map a non-standard variable name the device reports (the key) onto
                      the canonical NUT name it should be read as (the value). A canonical name
                      the device reports natively always wins over an alias, and every applied
                      alias is recorded in telemetry diagnostics.

                      A map rather than a list of pairs: a reported name can only ever resolve
                      one way, so making a duplicate key unrepresentable is better than
                      validating against it.
                    type: object
                  runtimeEstimate:
                    description: |-
                      runtimeEstimate declares whether the device's firmware recomputes battery.runtime against
                      present load, or reports a fixed estimate that does not respond to it (AE-6).

                      The distinction matters because a static estimate is a constant wearing a projection's name.
                      Anything that reasons forward from runtime -- advisory feasibility today, timing adaptation
                      once it exists -- is reading a number that will not move as the cluster sheds load.

                      Unset means unverified, which is deliberately not the same as Static. It leaves today's
                      behavior unchanged rather than downgrading every existing profile, while still withholding
                      the affirmative Dynamic claim that adaptation requires.
                    enum:
                    - Dynamic
                    - Static
                    type: string
                  variables:
                    description: variables are authoritative NUT variable names exposed
                      by matching devices.
                    items:
                      type: string
                    type: array
                type: object
              version:
                description: version is the semantic version of this behavior profile.
                minLength: 1
                type: string
            required:
            - selector
            - version
            type: object
          status:
            description: status defines the observed state of UPSCapabilityProfile
            properties:
              conditions:
                description: conditions represent the current state of the UPSCapabilityProfile
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the last generation reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase summarizes profile contract acceptance.
                enum:
                - Accepted
                - Error
                type: string
              profileHash:
                description: profileHash identifies the accepted capability profile
                  content.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

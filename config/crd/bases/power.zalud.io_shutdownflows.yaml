                    description: triggerActive is true while the trigger episode represented
                      by deduplicationKey remains eligible.
                    type: boolean
                  waveCount:
                    description: waveCount records how many compiled waves were handed
                      to the executor.
                    format: int32
                    type: integer
                required:
                - dryRun
                - triggerActive
                type: object
              observedGeneration:
                description: observedGeneration is the last generation reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase summarizes the current flow state.
                enum:
                - Pending
                - Compiled
                - Blocked
                - Running
                - Aborted
                - Completed
                - Error
                type: string
              publishedArtifact:
                description: publishedArtifact is the structured planner artifact
                  published for subscribers.
                properties:
                  diagrams:
                    description: diagrams are deterministic renderings generated from
                      graph.
                    properties:
                      d2:
                        description: d2 is the D2 rendering.
                        type: string
                      graphvizDOT:
                        description: graphvizDOT is the Graphviz DOT rendering.
                        type: string
                      mermaid:
                        description: mermaid is the Mermaid flowchart rendering.
                        type: string
                    type: object
                  explanations:
                    description: explanations record planner and edge-level "why"
                      statements.
                    items:
                      description: PlannerExplanationStatus is a publishable planner
                        "why" statement.
                      properties:
                        id:
                          description: id is the stable explanation id.
                          type: string
                        message:
                          description: message is the human-readable explanation.
                          type: string
                        reason:
                          description: reason is a machine-readable explanation reason.
                          type: string
                        subject:
                          description: subject identifies the graph edge, wave, or
                            planner object explained.
                          type: string
                      required:
                      - id
                      - message
                      type: object
                    type: array
                  graph:
                    description: graph is the normalized dependency graph.
                    properties:
                      edges:
                        description: edges are directed dependencies from from to
                          to.
                        items:
                          description: PlannerGraphEdgeStatus is one normalized graph
                            edge.
                          properties:
                            explanation:
                              description: explanation is the stable publishable reason
                                for this edge.
                              type: string
                            from:
                              description: from is the source graph vertex id.
                              type: string
                            id:
                              description: id is the stable graph edge id.
                              type: string
                            provenance:
                              description: provenance records whether the edge was
                                declared, derived, or policy-produced.
                              type: string
                            relation:
                              description: relation is the planner relation that produced
                                this edge.
                              type: string
                            sources:
                              description: sources identify the declarative fields
                                that produced this edge.
                              items:
                                description: PlannerGraphSourceRefStatus identifies
                                  a declarative source for a graph edge.
                                properties:
                                  field:
                                    description: field identifies the source input
                                      field.
                                    type: string
                                  kind:
                                    description: kind identifies the source input
                                      kind.
                                    type: string
                                  name:
                                    description: name identifies the source input
                                      object or item.
                                    type: string
                                type: object
                              type: array
                            to:
                              description: to is the destination graph vertex id.
                              type: string
                          required:
                          - from
                          - id
                          - to
                          type: object
                        type: array
                      vertices:
                        description: vertices are graph nodes.
                        items:
                          description: PlannerGraphVertexStatus is one normalized
                            graph vertex.
                          properties:
                            action:
                              description: action is the compiled shutdown action
                                associated with the vertex.
                              type: string
                            id:
                              description: id is the stable graph vertex id.
                              type: string
                            kind:
                              description: kind identifies the source vertex kind.
                              type: string
                            label:
                              description: label is the human-readable vertex label.
                              type: string
                            phase:
                              description: phase is the shutdown phase hint, when
                                present.
                              format: int32
                              type: integer
                            targetSummary:
                              description: targetSummary summarizes selected targets
                                without storing bulky object lists.
                              type: string
                          required:
                          - id
                          type: object
                        type: array
                    type: object
                  startupWaves:
                    description: startupWaves is the advisory reverse-order projection
                      for subscriber-owned recovery.
                    items:
                      description: CompiledShutdownWave is the status-visible execution
                        form of shutdown groups.
                      properties:
                        cumulativeDuration:
                          description: cumulativeDuration is the expected elapsed
                            time through this wave.
                          type: string
                        duration:
                          description: duration is the maximum expected duration of
                            any group in this wave.
                          type: string
                        groups:
                          description: groups are the shutdown group names in this
                            wave.
                          items:
                            type: string
                          type: array
                        index:
                          description: index is the zero-based wave order.
                          format: int32
                          type: integer
                        phase:
                          description: phase is the phase hint shared by this wave,
                            when one was present.
                          format: int32
                          type: integer
                      required:
                      - groups
                      - index
                      type: object
                    type: array
                type: object
              resolvedInputHash:
                description: resolvedInputHash identifies the declarative inventory
                  and UPS capability inputs used by the compiled plan.
                type: string
              topologyHash:
                description: topologyHash identifies the compiled declarative power
                  and communication topology.
                type: string
              triggerEvaluation:
                description: triggerEvaluation is the most recent trigger evaluation
                  against UPS telemetry status.
                properties:
                  decisions:
                    description: decisions records one decision per configured trigger.
                    items:
                      description: ShutdownTriggerDecisionStatus records the evaluation
                        result for one trigger.
                      properties:
                        eligible:
                          description: eligible is true when the telemetry condition
                            is true and hold-time gating has elapsed.
                          type: boolean
                        eligibleAt:
                          description: eligibleAt records when the hold duration is
                            satisfied.
                          format: date-time
                          type: string
                        holdStartedAt:
                          description: holdStartedAt records when this trigger/device
                            condition first became true.
                          format: date-time
                          type: string
                        matched:
                          description: matched is true when the telemetry condition
                            is currently true before hold-time gating.
                          type: boolean
                        reason:
                          description: reason explains the decision.
                          type: string
                        selectedUPSDevices:
                          description: selectedUPSDevices names UPS devices matched
                            by this trigger.
                          items:
                            type: string
                          type: array
                        triggerID:
                          description: triggerID is the controller-generated stable
                            identifier for this trigger position.
                          type: string
                        type:
                          description: type is the trigger kind.
                          enum:
                          - OnBattery
                          - LowBattery
                          - RuntimeBelow
                          - ChargeBelow
                          - TelemetryStale
                          type: string
                      required:
                      - eligible
                      - matched
                      type: object
                    type: array
                  diagnostics:
                    description: diagnostics records non-fatal warnings or trigger
                      definition errors surfaced by evaluation.
                    items:
                      description: ShutdownTriggerDiagnosticStatus records a trigger-evaluation
                        warning or error.
                      properties:
                        message:
                          description: message is the human-readable diagnostic.
                          type: string
                        reason:
                          description: reason is a machine-readable diagnostic reason.
                          type: string
                        severity:
                          description: severity is Warning or Error.
                          type: string
                        subject:
                          description: subject identifies the affected trigger or
                            UPS device.
                          type: string
                      required:
                      - message
                      - reason
                      - severity
                      type: object
                    type: array
                  eligible:
                    description: eligible is true when at least one trigger is eligible
                      to proceed to the executor boundary.
                    type: boolean
                  matchedTriggerCount:
                    description: matchedTriggerCount records how many triggers matched
                      telemetry before hold-time gating.
                    format: int32
                    type: integer
                  mode:
                    description: mode is the flow mode at evaluation time.
                    enum:
                    - DryRun
                    - Enforce
                    type: string
                  observedAt:
                    description: observedAt is the controller-supplied time used for
                      the evaluation.
                    format: date-time
                    type: string
                  planConfigHash:
                    description: planConfigHash is the compiled plan hash evaluated
                      with this trigger tick.
                    type: string
                  reason:
                    description: reason is the high-level evaluation reason.
                    type: string
                  selectedUPSDevices:
                    description: selectedUPSDevices is the sorted union of UPS devices
                      selected by eligible triggers.
                    items:
                      type: string
                    type: array
                required:
                - eligible
                type: object
              triggerHoldStates:
                description: triggerHoldStates persists compact hold timers for triggers
                  with spec.triggers[].for.
                items:
                  description: ShutdownTriggerHoldStateStatus persists one active
                    trigger hold timer.
                  properties:
                    startedAt:
                      description: startedAt records when the condition first became
                        true.
                      format: date-time
                      type: string
                    triggerID:
                      description: triggerID identifies the trigger whose condition
                        is being held.
                      type: string
                    upsDevice:
                      description: upsDevice is the UPSDevice name whose condition
                        is being held.
                      type: string
                  required:
                  - startedAt
                  - triggerID
                  - upsDevice
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

          status:
            description: status defines the observed state of ShutdownFlow
            properties:
              blockedNodeReleases:
                description: |-
                  blockedNodeReleases names nodes this flow will not power off because a group still
                  expected to be running is scheduled on them (OD-18). They are published because a
                  flow that quietly shuts down fewer nodes than its plan implies is worse than one
                  that says which nodes it is leaving up and why.
                items:
                  description: |-
                    BlockedNodeReleaseStatus is one node the flow will not power off, and the
                    group whose tier caused it to be held back.
                  properties:
                    groups:
                      description: |-
                        groups names the shutdown groups running on this node that are scheduled to
                        outlive it.
                      items:
                        type: string
                      type: array
                    message:
                      description: message explains the block in operator-facing terms.
                      type: string
                    nodeName:
                      description: nodeName is the cluster node withheld from power-off.
                      minLength: 1
                      type: string
                    nodeTier:
                      description: nodeTier is the node's own declared shutdown tier.
                      format: int32
                      type: integer
                    reason:
                      description: reason is the machine-readable cause, currently
                        always ShutdownTierInversion.
                      type: string
                  required:
                  - nodeName
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - nodeName
                x-kubernetes-list-type: map
              capabilityMatchCount:
                description: capabilityMatchCount records how many UPS devices received
                  capability profile matches.
                format: int32
                type: integer
              compiledSteps:
                description: compiledSteps is the controller-compiled view of the
                  flow for pre-flight review.
                items:
                  description: CompiledShutdownStep is the status-visible compiled
                    form of one flow step.
                  properties:
                    cumulativeDuration:
                      description: cumulativeDuration is the expected elapsed time
                        through this step.
                      type: string
                    id:
                      description: id is the source step id.
                      type: string
                    index:
                      description: index is the zero-based compiled order.
                      format: int32
                      type: integer
                    shutdownTier:
                      description: shutdownTier is the effective numbered shutdown
                        tier, when present.
                      format: int32
                      type: integer
                    targetSummary:
                      description: targetSummary summarizes selected targets without
                        storing bulky object lists.
                      type: string
                    type:
                      description: type is the source step type.
                      enum:
                      - Notify
                      - Wait
                      - CordonNodes
                      - DrainNodes
                      - ScaleWorkload
                      - RunWorkflow
                      - AgentShutdown
                      type: string
                  required:
                  - id
                  - index
                  - type
                  type: object
                type: array
              compiledWaves:
                description: compiledWaves is the dependency-graph execution plan
                  grouped into ordered waves.
                items:
                  description: CompiledShutdownWave is the status-visible execution
                    form of shutdown groups.
                  properties:
                    cumulativeDuration:
                      description: cumulativeDuration is the expected elapsed time
                        through this wave.
                      type: string
                    duration:
                      description: duration is the maximum expected duration of any
                        group in this wave.
                      type: string
                    groups:
                      description: groups are the shutdown group names in this wave.
                      items:
                        type: string
                      type: array
                    index:
                      description: index is the zero-based wave order.
                      format: int32
                      type: integer
                    phase:
                      description: phase is the phase hint shared by this wave, when
                        one was present.
                      format: int32
                      type: integer
                    shutdownTier:
                      description: shutdownTier is the numbered tier shared by this
                        wave, when tier policy assigned one.
                      format: int32
                      type: integer
                  required:
                  - groups
                  - index
                  type: object
                type: array
              conditions:
                description: conditions represent the current state of the ShutdownFlow
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,

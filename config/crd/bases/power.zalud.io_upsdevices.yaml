---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: upsdevices.power.zalud.io
spec:
  group: power.zalud.io
  names:
    kind: UPSDevice
    listKind: UPSDeviceList
    plural: upsdevices
    singular: upsdevice
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UPSDevice is the Schema for the upsdevices API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of UPSDevice
            properties:
              credentialSecretRef:
                description: credentialSecretRef points at driver credentials, such
                  as SNMP community or SNMPv3 auth material.
                properties:
                  name:
                    description: name is the referenced object's metadata.name.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace is the referenced object's namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              displayName:
                description: displayName is a human-readable name for events and published
                  artifacts.
                type: string
              driver:
                description: |-
                  driver is the Network UPS Tools driver name for a network-capable UPS driver,
                  such as snmp-ups, netxml-ups, powerman-pdu, apcupsd-ups, or dummy-ups for
                  tests. It is required unless upstreamNUT is set. Local USB and serial drivers
                  are intentionally unsupported by this API.
                type: string
              driverOptions:
                additionalProperties:
                  type: string
                description: driverOptions is rendered into ups.conf for this device.
                type: object
              endpoint:
                description: |-
                  endpoint describes the network endpoint reached by the NUT driver. It is not
                  a USB, serial, or host device path. Use upstreamNUT instead for devices that
                  already expose their own NUT data server.
                properties:
                  host:
                    description: host is the DNS name or IP address reached by the
                      NUT driver.
                    minLength: 1
                    type: string
                  port:
                    description: port is the driver-specific network port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - host
                type: object
              identity:
                description: |-
                  identity declares stable capability matching keys when they are known from
                  inventory, a trusted probe, or a vendor-reported NUT model string.
                properties:
                  firmware:
                    description: firmware narrows matching to a specific provider-reported
                      firmware string.
                    type: string
                  model:
                    description: model is the provider-reported NUT ups.model value
                      or trusted inventory equivalent.
                    type: string
                type: object
              powerDomains:
                description: powerDomains names the physical power domains this UPS
                  supplies.
                items:
                  type: string
                type: array
              telemetry:
                description: telemetry controls device polling and stale-data behavior.
                properties:
                  alertPollInterval:
                    description: alertPollInterval controls polling while the UPS
                      is on battery or otherwise degraded.
                    type: string
                  pollInterval:
                    description: pollInterval controls normal-state telemetry polling.
                    type: string
                type: object
              thresholds:
                description: thresholds defines policy-relevant UPS thresholds.
                properties:
                  minChargePercent:
                    description: minChargePercent is the minimum battery charge before
                      the UPS is considered critical.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  minRuntimeSeconds:
                    description: minRuntimeSeconds is the minimum remaining runtime
                      before the UPS is considered critical.
                    format: int64
                    minimum: 0
                    type: integer
                  onBatteryHoldoff:
                    description: onBatteryHoldoff delays action for short transfer
                      events.
                    type: string
                  staleAfter:
                    description: staleAfter marks telemetry stale after this duration
                      without a successful poll.
                    type: string
                type: object
              upstreamNUT:
                description: |-
                  upstreamNUT describes a UPS that already exposes a network NUT server. The
                  generated NUTServer relays it through dummy-ups repeater mode.
                properties:
                  auth:
                    description: |-
                      auth configures how dummy-ups repeater mode discovers authentication and
                      trust material for the upstream NUT server.
                    properties:
                      mode:
                        default: None
                        description: |-
                          mode selects the upstream authconf source. The default disables authconf
                          parsing so unauthenticated appliances do not depend on image defaults.
                        enum:
                        - None
                        - Default
                        - Secret
                        type: string
                      secretKeyRef:
                        description: |-
                          secretKeyRef points at a Secret key containing a complete nutauth.conf file.
                          The Secret must be in the rendered NUTServer operand namespace.
                        properties:
                          key:
                            description: key is the data key inside the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name is the Secret name.
                            minLength: 1
                            type: string
                          namespace:
                            description: namespace is the Secret namespace.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    type: object
                  host:
                    description: host is the DNS name or IP address of the upstream
                      upsd server.
                    minLength: 1
                    type: string
                  port:
                    default: 3493
                    description: port is the upstream upsd TCP port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  strictStart:
                    default: true
                    description: |-
                      strictStart preserves dummy-ups repeater mode's strict startup behavior.
                      When false, startup continues even if the upstream server is unavailable.
                    type: boolean
                  upsName:
                    description: upsName is the upstream UPS name served by the upstream
                      upsd server.
                    minLength: 1
                    type: string
                required:
                - host
                - upsName
                type: object
            type: object
          status:
            description: status defines the observed state of UPSDevice
            properties:
              batteryChargePercent:
                description: batteryChargePercent is the last observed battery.charge
                  value.
                format: int32
                type: integer
              conditions:
                description: conditions represent the current state of the UPSDevice
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastPollTime:
                description: lastPollTime is the most recent successful telemetry
                  poll.
                format: date-time
                type: string
              lastStatus:
                description: lastStatus is the last observed NUT ups.status value.
                type: string
              loadPercent:
                description: loadPercent is the last observed ups.load value.
                format: int32
                type: integer
              nutName:
                description: nutName is the rendered NUT device name.
                type: string
              observedGeneration:
                description: observedGeneration is the last generation reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase summarizes the current observed device state.
                enum:
                - Unknown
                - Online
                - OnBattery
                - LowBattery
                - Stale
                - Unavailable
                type: string
              runtimeSeconds:
                description: runtimeSeconds is the last observed battery.runtime value.
                format: int64
                type: integer
              serverRefs:
                description: serverRefs names NUTServer resources currently serving
                  this device.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

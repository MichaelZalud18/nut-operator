---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pducapabilityprofiles.power.zalud.io
spec:
  group: power.zalud.io
  names:
    kind: PDUCapabilityProfile
    listKind: PDUCapabilityProfileList
    plural: pducapabilityprofiles
    singular: pducapabilityprofile
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PDUCapabilityProfile is the Schema for the pducapabilityprofiles
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PDUCapabilityProfile
            properties:
              outlets:
                description: outlets describes the outlet layout of matching devices.
                properties:
                  count:
                    description: |-
                      count is the number of outlets the device exposes. Unset means undeclared,
                      which is not the same as a device with no outlets; nothing infers one from
                      the other.
                    format: int32
                    minimum: 0
                    type: integer
                  switchable:
                    description: |-
                      switchable names the outlets that can be switched independently, using NUT's
                      outlet identifiers. Empty alongside a non-zero count describes a metered-only
                      PDU: it reports per-outlet readings and switches nothing.

                      Declaring an outlet here does not make it switchable by this operator. No PDU
                      actuation is implemented; see docs/tasks-post-v1.md.
                    items:
                      type: string
                    type: array
                type: object
              quirks:
                description: quirks records behavior-affecting quirks consumed by
                  planner or executor policy.
                items:
                  type: string
                type: array
              selector:
                description: |-
                  selector declares which PDU devices this profile can match. The precedence
                  chain is the one UPS profiles use: exact model plus firmware, exact model,
                  model glob, driver family, then the universal fallback.
                properties:
                  driverFamily:
                    description: driverFamily matches the NUT driver family, such
                      as snmp-ups.
                    type: string
                  firmware:
                    description: firmware narrows an exact model match to a specific
                      firmware string.
                    type: string
                  model:
                    description: model matches an exact provider model string.
                    type: string
                  modelGlob:
                    description: modelGlob matches a provider model string using path.Match
                      glob semantics.
                    type: string
                  universal:
                    default: false
                    description: |-
                      universal marks this profile as the unidentified-device fallback. At most one
                      PDU profile may set it.
                    type: boolean
                type: object
              telemetry:
                description: telemetry declares authoritative NUT variables exposed
                  by matching devices.
                properties:
                  aliases:
                    additionalProperties:
                      type: string
                    description: |-
                      aliases map a non-standard variable name the device reports (the key) onto
                      the canonical NUT name it should be read as (the value), with the same
                      one-directional, native-wins semantics as UPS profiles (OD-23).
                    type: object
                  variables:
                    description: variables are authoritative NUT variable names exposed
                      by matching devices.
                    items:
                      type: string
                    type: array
                type: object
              version:
                description: version is the semantic version of this behavior profile.
                minLength: 1
                type: string
            required:
            - selector
            - version
            type: object
          status:
            description: status defines the observed state of PDUCapabilityProfile
            properties:
              conditions:
                description: conditions represent the current state of the PDUCapabilityProfile
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the last generation reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase summarizes profile contract acceptance.
                enum:
                - Accepted
                - Error
                type: string
              profileHash:
                description: profileHash identifies the accepted capability profile
                  content.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

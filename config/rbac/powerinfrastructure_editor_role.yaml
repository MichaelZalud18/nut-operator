# This rule is not used by the project nut-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the power.zalud.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nut-operator
    app.kubernetes.io/managed-by: kustomize
  name: powerinfrastructure-editor-role
rules:
- apiGroups:
  - power.zalud.io
  resources:
  - powerinfrastructures
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - power.zalud.io
  resources:
  - powerinfrastructures/status
  verbs:
  - get

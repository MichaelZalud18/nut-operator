    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: nut-operator
    control-plane: controller-manager
  name: nut-operator-controller-manager
  namespace: nut-operator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-operator
      control-plane: controller-manager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: nut-operator
  name: nut-operator-allow-metrics-traffic
  namespace: nut-operator-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nut-operator
      control-plane: controller-manager
  policyTypes:
  - Ingress

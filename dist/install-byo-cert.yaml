                    type: string
                  model:
                    description: model is the provider-reported NUT ups.model value
                      or trusted inventory equivalent.
                    type: string
                type: object
              powerDomains:
                description: powerDomains names the physical power domains this UPS
                  supplies.
                items:
                  type: string
                type: array
              simulation:
                description: |-
                  simulation configures scripted state-transition fixture data for the dummy-ups driver, used
                  to exercise OnBattery/LowBattery transitions in tests without real hardware. Only valid when
                  driver is dummy-ups and upstreamNUT is not set.
                properties:
                  sequenceConfigMapRef:
                    description: |-
                      sequenceConfigMapRef points at a ConfigMap holding a dummy-ups `.seq` scripted
                      transition fixture (NUT's TIMER-directive format: blocks of `variable: value` lines,
                      optionally preceded by a `TIMER <seconds>` line, separated by blank lines, looping once the
                      sequence ends). Must be in the rendered NUTServer operand namespace, matching
                      credentialSecretRef's convention.
                    properties:
                      name:
                        description: name is the referenced object's metadata.name.
                        minLength: 1
                        type: string
                      namespace:
                        description: namespace is the referenced object's namespace.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  sequenceKey:
                    default: sequence.seq
                    description: sequenceKey is the ConfigMap data key holding the
                      .seq fixture content.
                    type: string
                required:
                - sequenceConfigMapRef
                type: object
              telemetry:
                description: telemetry controls device polling and stale-data behavior.
                properties:
                  alertPollInterval:
                    description: alertPollInterval controls polling while the UPS
                      is on battery or otherwise degraded.
                    type: string
                  pollInterval:
                    description: pollInterval controls normal-state telemetry polling.
                    type: string
                type: object
              thresholds:
                description: thresholds defines policy-relevant UPS thresholds.
                properties:
                  minChargePercent:
                    description: minChargePercent is the minimum battery charge before
                      the UPS is considered critical.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  minRuntimeSeconds:
                    description: minRuntimeSeconds is the minimum remaining runtime
                      before the UPS is considered critical.
                    format: int64
                    minimum: 0
                    type: integer
                  onBatteryHoldoff:
                    description: onBatteryHoldoff delays action for short transfer
                      events.
                    type: string
                  staleAfter:
                    description: staleAfter marks telemetry stale after this duration
                      without a successful poll.
                    type: string
                type: object
              upstreamNUT:
                description: |-
                  upstreamNUT describes a UPS that already exposes a network NUT server. The
                  generated NUTServer relays it through dummy-ups repeater mode.
                properties:
                  auth:
                    description: |-
                      auth configures how dummy-ups repeater mode discovers authentication and
                      trust material for the upstream NUT server.
                    properties:
                      mode:
                        default: None
                        description: |-
                          mode selects the upstream authconf source. The default disables authconf
                          parsing so unauthenticated appliances do not depend on image defaults.
                        enum:
                        - None
                        - Default
                        - Secret
                        type: string
                      secretKeyRef:
                        description: |-
                          secretKeyRef points at a Secret key containing a complete nutauth.conf file.
                          The Secret must be in the rendered NUTServer operand namespace.
                        properties:
                          key:
                            description: key is the data key inside the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name is the Secret name.
                            minLength: 1
                            type: string
                          namespace:
                            description: namespace is the Secret namespace.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    type: object
                  host:
                    description: host is the DNS name or IP address of the upstream
                      upsd server.
                    minLength: 1
                    type: string
                  port:
                    default: 3493
                    description: port is the upstream upsd TCP port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  strictStart:
                    default: true
                    description: |-
                      strictStart preserves dummy-ups repeater mode's strict startup behavior.
                      When false, startup continues even if the upstream server is unavailable.
                    type: boolean
                  upsName:
                    description: upsName is the upstream UPS name served by the upstream
                      upsd server.
                    minLength: 1
                    type: string
                required:
                - host
                - upsName
                type: object
            type: object
          status:
            description: status defines the observed state of UPSDevice
            properties:
              batteryChargePercent:
                description: batteryChargePercent is the last observed battery.charge
                  value.
                format: int32
                type: integer
              capability:
                description: capability reports the capability profile this device
                  resolves to.
                properties:
                  actuationBehaviors:
                    description: |-
                      actuationBehaviors names the actuation behaviors the matched profile declares as verified for
                      this device. Empty is the normal and deliberate state: profiles declare nothing until the
                      behavior has been verified against real firmware (F-27), so an empty list means "not
                      verified", never "not capable".
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  message:
                    description: message explains reason in one sentence.
                    type: string
                  profileHash:
                    description: |-
                      profileHash identifies the exact profile content the match was computed against, so a
                      resolution can be tied to a specific catalog revision.
                    type: string
                  profileID:
                    description: profileID is the capability profile this device currently
                      resolves to.
                    type: string
                  profileSource:
                    description: profileSource records whether the profile came from
                      the bundled catalog or a CRD.
                    type: string
                  profileVersion:
                    description: profileVersion is that profile's semantic version.
                    type: string
                  quirks:
                    description: quirks names the profile quirks in force for this
                      device after firmware scoping.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  reason:
                    description: |-
                      reason carries the machine-readable reason the resolution is not a clean product match, or
                      the reason it could not be computed at all. Empty on a clean match.
                    type: string
                  tier:
                    description: |-
                      tier is the precedence tier that produced the match, from an exact model and firmware match
                      down to the unidentified floor.
                    type: string
                  unidentified:
                    description: unidentified is true when no profile matched this
                      device and the universal floor was used.
                    type: boolean
                type: object
              conditions:
                description: conditions represent the current state of the UPSDevice
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastPollTime:
                description: lastPollTime is the most recent successful telemetry
                  poll.
                format: date-time
                type: string
              lastStatus:
                description: lastStatus is the last observed NUT ups.status value.
                type: string
              loadPercent:
                description: loadPercent is the last observed ups.load value.
                format: int32
                type: integer
              nutName:
                description: nutName is the rendered NUT device name.
                type: string
              observedGeneration:
                description: observedGeneration is the last generation reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase summarizes the current observed device state.
                enum:
                - Unknown
                - Online
                - OnBattery
                - LowBattery
                - Stale
                - Unavailable
                type: string
              runtimeSeconds:
                description: runtimeSeconds is the last observed battery.runtime value.
                format: int64
                type: integer
              serverRefs:
                description: serverRefs names NUTServer resources currently serving
                  this device.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

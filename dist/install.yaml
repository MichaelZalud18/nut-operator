  - nut-operator-webhook-service.nut-operator-system.svc
  - nut-operator-webhook-service.nut-operator-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: nut-operator-selfsigned-issuer
  secretName: webhook-server-cert

    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/kubeactions/terminal_handoff.go"
      line_start: 44
      line_end: 44
      reason: "Indexes a set with a signal data-map key to reject duplicate delivery destinations."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/kubeactions/terminal_handoff.go"

# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: nut-operator
fail_on_findings: true
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: ".ash/**"
      reason: "Local ASH scratch, tool cache, and generated scan reports."
    - path: "bin/**"
      reason: "Gitignored local tool cache, not project code. Holds downloaded third-party binaries -- envtest's kube-apiserver/etcd/kubectl, controller-gen, kustomize, golangci-lint, and grype and syft themselves. grype reports every CVE compiled into those binaries, which are findings about the tools running the scan rather than about anything this repository ships. Vulnerabilities in what the operator actually ships are still caught: go.mod/go.sum are scanned, and the operand images are scanned in images.yml."
    - path: "api/**/zz_generated.deepcopy.go"
      reason: "Kubebuilder generated deepcopy code."
  suppressions:
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "config/certmanager/certificate-metrics.yaml"
      reason: "Kubernetes Certificate secretName field, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "config/certmanager/certificate-webhook.yaml"
      reason: "Kubernetes Certificate secretName field, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "config/default/cert_metrics_manager_patch.yaml"
      reason: "Kubernetes volume secretName field, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "config/default/manager_webhook_patch.yaml"
      reason: "Kubernetes volume secretName field, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "dist/install.yaml"
      reason: "Generated install bundle contains Kubernetes secretName fields, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "dist/install-byo-cert.yaml"
      reason: "Generated install bundle contains Kubernetes secretName fields, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "hack/webhook-cert.sh"
      reason: "Default Secret object names the script creates (webhook-server-cert, nut-operator-webhook-ca). Key material is generated at runtime into a mktemp directory and never written to the repository."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/nodepoweragent_render.go"
      reason: "Code references Kubernetes Secret refs; it does not contain secret values."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/nutserver_render.go"
      reason: "Code references Kubernetes Secret refs; it does not contain secret values."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/nut_tls_render_test.go"
      reason: "Asserts the Secret data keys (tls.crt, tls.key, ca.crt) the NUT TLS render requires; the fixture values are literal placeholders, not secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/nutserver_render_test.go"
      reason: "Test fixture literals (e.g. real-auth-pass) asserting credentialSecretRef values merge into rendered ups.conf; not real secret material."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/validation.go"
      reason: "Validation messages reference Secret ref fields; they do not contain secret values."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/kubeactions/runner.go"
      reason: "Code tracks Secret Data map keys and namespace/name pairs for the AgentShutdown signal handoff; it does not contain secret values."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/storage/connector.go"
      reason: "Code references Kubernetes Secret refs; it does not contain secret values."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/webhook/v1alpha1/nutserver_webhook.go"
      reason: "Webhook validation references Secret ref fields; it does not contain secret values."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/webhook/v1alpha1/upsdevice_webhook.go"
      reason: "Webhook validation references Secret ref fields; it does not contain secret values."
    - rule_id: "CKV_K8S_43"
      path: "config/manager/manager.yaml"
      reason: "The base manager image is a Kustomize placeholder; release and GitOps overlays use immutable digests."
    - rule_id: "CKV_K8S_15"
      path: "config/manager/manager.yaml"
      reason: "imagePullPolicy is IfNotPresent so the e2e suite's kind-loaded image is used instead of a real registry pull. Every real deployment overrides the base image with an explicit digest via Kustomize, so Always vs IfNotPresent makes no practical staleness difference — content is already verified by digest."
    - rule_id: "CKV_K8S_38"
      path: "config/manager/manager.yaml"
      reason: "The controller manager requires Kubernetes API credentials to reconcile CRDs and owned resources."
# Scanners this repository deliberately does not run are excluded via ASH_EXCLUDED_SCANNERS in the
# Makefile, not here. `enabled: false` stops a scanner running but still reports it as MISSING,
# which is the exact ambiguity the exclusion is meant to remove.
scanners:
  checkov:
    options:
      additional_formats: []
      skip_frameworks:
        - kustomize
      skip_path:
        - path: "dist/install.yaml"
          reason: "Generated release bundle; source manifests are scanned."
        - path: "dist/install-byo-cert.yaml"
          reason: "Generated release bundle; source manifests are scanned."
reporters:
  html:
    enabled: true
  flat-json:
    enabled: true
  github-ghas:
    enabled: true
  markdown:
    enabled: true
    options:
      include_summary: true
      include_findings_table: true
      include_detailed_findings: true
      max_detailed_findings: 50
  sarif:
    enabled: true
  text:
    enabled: true

    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "test/e2e/metrics_component_test.go"
      line_start: 34
      line_end: 34
      reason: "Asserts Kubernetes service-account token projection and absence of Secret/hostPath volume sources; no token literal."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "test/e2e/metrics_component_test.go"
      line_start: 86
      line_end: 86

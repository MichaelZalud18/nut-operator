# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: nut-operator
fail_on_findings: true
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: ".ash/**"
      reason: "Local ASH scratch, tool cache, and generated scan reports."
    - path: "bin/**"
      reason: "Gitignored local tool cache, not project code. Holds downloaded third-party binaries -- envtest's kube-apiserver/etcd/kubectl, controller-gen, kustomize, golangci-lint, and grype and syft themselves. grype reports every CVE compiled into those binaries, which are findings about the tools running the scan rather than about anything this repository ships. Vulnerabilities in what the operator actually ships are still caught: go.mod/go.sum are scanned, and the operand images are scanned in images.yml."
    - path: "api/**/zz_generated.deepcopy.go"
      reason: "Kubebuilder generated deepcopy code."
  suppressions:
    # CI triage 2026-09-19, run 35477169305: exact rule/path/line exceptions.
    # These findings contain fixture behavior or public identifiers, not site credentials.
    - rule_id: "B104"
      path: "test/e2e/fixtures/ex34_barrier.py"
      line_start: 59
      line_end: 59
      reason: "Owned Kind pod must accept the manager's hook over its Service; no host networking or host operations. The barrier release endpoint separately enforces loopback-only callers."
    - rule_id: "B104"
      path: "test/e2e/fixtures/mod2_receiver.py"
      line_start: 50
      line_end: 50
      reason: "Owned Kind pod receives authenticated test hooks over its Service; binding pod interfaces is required. This fixture records events and never invokes host operations."
    - rule_id: "B113"
      path: "test/e2e/fixtures/ex34_barrier.py"
      line_start: 29
      line_end: 29
      reason: "requests is a local dictionary, not the requests HTTP library. Its get performs no I/O; the barrier's event wait is separately bounded to 120 seconds."
    - rule_id: "CKV_GHA_7"
      path: ".github/workflows/talos-actuator-smoke.yml"
      line_start: 23
      line_end: 23
      reason: "Manual input selects a Go test regex in disposable guests, not a published build. It is passed through an environment variable as one quoted argument; this workflow has read-only repository permissions."
    - rule_id: "CKV_GHA_7"
      path: ".github/workflows/test-e2e.yml"
      line_start: 17
      line_end: 17
      reason: "Boolean manual input enables an additional startup observation against checkout-built images. It cannot change the build or bypass the reusable image workflow's acceptance gate."
    - rule_id: "SECRET-BASE64-HIGH-ENTROPY-STRING"
      path: "test/e2e/driver_recovery_component_test.go"
      line_start: 18
      line_end: 20
      reason: "Tab-delimited dummy-ups protocol fixtures with synthetic process IDs, not encoded credentials."
    - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
      path: "internal/inventory/stable_hash_test.go"
      line_start: 56
      line_end: 56
      reason: "Public SHA-256 compatibility fixture for the empty inventory JSON object."
    - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
      path: "internal/shutdownflow/hash_encoding_test.go"
      line_start: 68
      line_end: 68
      reason: "Public SHA-256 compatibility fixture for canonical empty target JSON."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/nodepoweragent_tls.go"
      line_start: 101
      line_end: 101
      reason: "Copies an existing Kubernetes Secret reference from the API specification; no credential literal."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/nutserver_credentials.go"
      line_start: 72
      line_end: 72
      reason: "Compares an authentication mode enum and checks a Secret reference for nil; no credential literal."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/shutdownflow_quorum.go"
      line_start: 37
      line_end: 37
      reason: "Tests signal-channel marker and public Kubernetes label keys, not secret data."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "internal/controller/shutdownflow_release_safety_test.go"

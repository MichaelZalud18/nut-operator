name: E2E Tests

# Two entry points, deliberately different in what they test (F-77).
#
# pull_request runs the suite against images it builds from the checkout, because a PR publishes
# nothing there is anything to pull.
#
# workflow_call is how Images invokes it on push to main, handing over the digests it just
# published. That path tests the artifact that is about to carry the :main tag rather than a second
# build of the same source. There is no push trigger here any more: a run that races the build
# workflow cannot gate it, and two independent e2e runs on one commit is the cost without the
# benefit.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_call:
    inputs:
      manager-image:
        description: Pre-built manager image reference the suite should pull instead of building.
        required: true
        type: string
      nut-server-image:
        description: Pre-built nut-server image reference.
        required: true
        type: string
      upsmon-agent-image:
        description: Pre-built upsmon-agent image reference.
        required: true
        type: string
      node-actuator-image:
        description: Pre-built node-actuator image reference.
        required: true
        type: string

# Prefixed so this can never collide with the caller's group. When invoked through workflow_call,
# github.workflow is the *caller's* name, so a bare ${{ github.workflow }}-${{ github.ref }} would
# resolve to the Images group and, with cancel-in-progress, this workflow would cancel the run
# invoking it.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
      # Needed only on the workflow_call path, to pull the images Images just published.
      packages: read
    name: E2E on Kind
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache local build tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', '.custom-gcl.yml') }}

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The runner default is 128, which is not enough for the three-node cluster the suite now
      # creates (F-109): the last node's kubelet dies with "inotify_init: too many open files" and
      # never joins, while `kind create` still exits 0. `make setup-test-e2e` refuses to continue
      # under the default rather than run on a cluster that is quietly one node short, so this step
      # is what lets it proceed.
      - name: Raise inotify limits for the multi-node Kind cluster
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Log in to GHCR
        if: inputs.manager-image != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The suite builds every image itself when these are empty, which is the pull_request path and
      # also what a developer running `make test-e2e` gets. When they are set it pulls instead and
      # re-tags to the same local names, so no spec can tell the difference.
      #
      # The snmpsim fixture is deliberately absent: it is a simulated SNMP UPS used only by the
      # driver-conformance suite, not a project operand, so it is not published and has nothing to
      # pull. It builds from the checkout on both paths.
      - name: Running Test e2e
        env:
          E2E_MANAGER_IMAGE: ${{ inputs.manager-image }}
          E2E_NUT_SERVER_IMAGE: ${{ inputs.nut-server-image }}
          E2E_UPSMON_AGENT_IMAGE: ${{ inputs.upsmon-agent-image }}
          E2E_NODE_ACTUATOR_IMAGE: ${{ inputs.node-actuator-image }}
        run: make test-e2e

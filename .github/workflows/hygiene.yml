name: Repo Hygiene

# Deliberately no paths-ignore. Every other workflow skips "**.md" and "docs/**" because Go tests and
# image builds cannot be affected by prose -- but both checks here are about exactly the files those
# filters exclude. The private-IP scan guards a public repo against topology leaking through
# documentation and examples, which is the likeliest place for it to happen and, until this workflow
# existed, the one commit shape that was never scanned. The sample validation covers
# `docs/examples/`, which is documentation by path and applied YAML by content.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-samples:
    permissions:
      contents: read
    name: Validate samples against CRD schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the validator's dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml jsonschema

      # Through the make target rather than the script directly, so the CRDs are regenerated from the
      # Go types first. Validating samples against stale committed CRDs would check them against the
      # schema of a previous commit, which is the failure this is meant to catch.
      - name: Validate samples and examples
        run: make validate-samples

  installer-freshness:
    permissions:
      contents: read
    name: Check the committed installers match the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # dist/install.yaml is the documented one-command install, and it is a build artifact that
      # happens to be committed -- which means it can silently fall behind the manifests it is built
      # from. It did: the ShutdownHook CRD and its webhooks were added and the bundle was never
      # rebuilt, so `kubectl apply -f dist/install.yaml` produced a cluster where the RunHook action
      # had no CRD to read. Nothing failed at build, test, or lint time, because nothing compared the
      # committed bytes to what the generator would emit.
      #
      # The image tag is pinned to the committed value so this checks staleness of the manifests and
      # not of the tag, which build-installer rewrites as a side effect.
      - name: Rebuild the installers and diff them against the tree
        run: |
          set -euo pipefail
          IMG="$(grep -m1 -oE 'ghcr\.io/[^[:space:]]+' dist/install.yaml)"
          echo "Rebuilding installers with IMG=$IMG"
          make build-installer build-installer-byo-cert IMG="$IMG"
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale. Run: make build-installer build-installer-byo-cert IMG=$IMG"
            git diff --stat -- dist/
            git diff -- dist/ | head -200
            exit 1
          fi
          echo "Committed installers match the generated manifests."

  manifest-admission:
    permissions:
      contents: read
    name: Apply the installers against a real API server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      # A default single-node cluster on purpose. This job needs an API server to validate against
      # and nothing else -- no NetworkPolicy enforcement, no second node -- so it deliberately does
      # not use test/e2e/kind-config.yaml, which is shaped for the e2e suite and costs minutes.
      - name: Create a throwaway cluster
        run: kind create cluster --name manifest-admission

      # F-113. Three ShutdownHook helper ClusterRoles shipped with an empty `resources:` list, which
      # the API server rejects outright and every other gate accepted: envtest never applies these
      # roles, validate-samples only checks CRs against CRD schemas, and installer-freshness diffs
      # dist/ against itself. The first thing to notice was the e2e job, four image builds in.
      #
      # Server-side, not client-side: `--dry-run=client` does not run admission or API validation,
      # so it accepts the empty rule too. The whole point is to reach the validation that rejected it.
      - name: Server-side dry-run both installers
        run: |
          set -euo pipefail
          status=0
          for bundle in dist/install.yaml dist/install-byo-cert.yaml; do
            echo "::group::$bundle"
            if ! kubectl apply --server-side --dry-run=server -f "$bundle"; then
              echo "::error::$bundle was rejected by the API server"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Delete the throwaway cluster
        if: always()
        run: kind delete cluster --name manifest-admission

  private-ip-scan:
    permissions:
      contents: read
    name: Scan for private IP literals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # This repo is public. None of ASH's scanners (detect-secrets, checkov, bandit, semgrep) check
      # for private-network IPv4 literals -- that's not a secret or a misconfiguration by any of their
      # definitions, it's site-specific topology leakage, a different concern CONTRIBUTING.md states as
      # policy but that had no automated check behind it.
      #
      # Two exclusions, both for the same reason: the address is a generic container-network value
      # that describes nothing about any real site. .devcontainer/ carries a Docker network config
      # value. test/e2e/kind-config.yaml carries the pod subnet of a throwaway Kind cluster, set to
      # Calico's own default pool so its manifest applies unedited (F-109); the alternative is
      # patching a CIDR into a 7800-line upstream manifest on every setup, which trades a literal
      # nobody can leak anything through for surgery that breaks silently.
      #
      # Both are single, named paths on purpose. A directory-wide or pattern-wide carve-out is how
      # this check stops being one.
      - name: Fail on RFC1918 IPv4 literals in tracked files
        run: |
          set -euo pipefail
          PATTERN='\b(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})\b'
          if git ls-files -z \
              | grep -zv '^\.devcontainer/' \
              | grep -zv '^test/e2e/kind-config\.yaml$' \
              | xargs -0 grep -EIno "$PATTERN" > /tmp/private-ip-matches.txt; then
            echo "::error::Found a private (RFC1918) IPv4 address literal in a tracked file. This repo is public -- use a *.example.net/*.example.com hostname (see config/samples/, docs/examples/) or an RFC 5737 documentation address (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) instead."
            cat /tmp/private-ip-matches.txt
            exit 1
          fi
          echo "No private IPv4 literals found in tracked files."

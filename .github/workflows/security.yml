name: Security Scan

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  UV_CACHE_DIR: /tmp/nut-operator-ash-uv-cache
  UV_TOOL_DIR: /tmp/nut-operator-ash-uv-tools

jobs:
  ash:
    permissions:
      contents: read
    name: ASH security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache ASH's uv cache and tool install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.UV_TOOL_DIR }}
          key: ${{ runner.os }}-ash-uv-v3.5.8

      - name: Install AWS Labs ASH
        run: uv tool install 'git+https://github.com/awslabs/automated-security-helper.git@v3.5.8'

      # grype and syft are ASH scanner dependencies, installed by the make target from pinned,
      # checksum-verified release archives. Cached because grype is a ~70MB download; its
      # vulnerability database is deliberately not cached, since a stale database is a scan that
      # silently stops finding new CVEs.
      - name: Cache grype and syft
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin
          key: ${{ runner.os }}-anchore-grype0.116.1-syft1.50.0

      # Before the scan, because on a clean repository every branch of the triage extraction is dead
      # code -- a mistake in it would sit undetected until the day a real finding needed reporting.
      - name: Check the triage extraction
        run: python3 hack/ash-triage.py --selftest

      - name: Run ASH security scan
        run: make security-scan

      # Runs even when the scan fails, which is the only time it matters. ASH's own output is a
      # per-scanner count table, so a red build says "grype: 2 critical" and nothing about which
      # two -- answering that meant downloading the artifact below and reading SARIF by hand. This
      # names them in the log and in the job summary instead. --exit-zero because the scan step
      # above already decided the job's fate; this step reports, it does not gate.
      - name: Triage actionable findings
        if: always()
        run: make security-triage TRIAGE_FLAGS=--exit-zero

      - name: Upload ASH report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ash-report
          path: /tmp/nut-operator-ash-output
          retention-days: 14

  private-ip-scan:
    permissions:
      contents: read
    name: Scan for private IP literals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # This repo is public. None of ASH's scanners (detect-secrets, checkov, bandit, semgrep) check
      # for private-network IPv4 literals -- that's not a secret or a misconfiguration by any of their
      # definitions, it's site-specific topology leakage, a different concern CONTRIBUTING.md states as
      # policy but that (until now) had no automated check behind it. .devcontainer/ is excluded: its
      # RFC1918 usage is a generic Docker network config value, not site-specific infrastructure.
      - name: Fail on RFC1918 IPv4 literals in tracked files
        run: |
          set -euo pipefail
          PATTERN='\b(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})\b'
          if git ls-files -z \
              | grep -zv '^\.devcontainer/' \
              | xargs -0 grep -EIno "$PATTERN" > /tmp/private-ip-matches.txt; then
            echo "::error::Found a private (RFC1918) IPv4 address literal in a tracked file. This repo is public -- use a *.example.net/*.example.com hostname (see config/samples/, docs/examples/) or an RFC 5737 documentation address (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) instead."
            cat /tmp/private-ip-matches.txt
            exit 1
          fi
          echo "No private IPv4 literals found in tracked files."

name: Hadron Actuator Smoke Test

# VM-3's three milestones: manually triggered only. Boots one Hadron guest to a Ready k3s node per
# test (the same proof VM-2's boot-smoke workflow already established), builds the real, shipped
# node-actuator image from this checkout's own images/node-actuator/Dockerfile, imports it into
# each guest's own containerd, and deploys it with production's real PowerOff/Actuate security
# context and environment.
#
# TestHadronActuatorArmsWithNoSignal: no shutdown signal is ever written, so the only thing under
# test is whether CAP_SYS_BOOT survives to the actuator's own startup check in a real kernel,
# kubelet, and containerd.
#
# TestHadronActuatorRejectsInvalidSignals: real signal delivery via a real Kubernetes Secret, but
# only the rejected shapes (wrong node, stale) -- VM-3's own text names "negative cases must leave
# the guest running" as a requirement to prove, before ever attempting the one signal shape that
# can actually halt a guest.
#
# TestHadronActuatorHaltsOnAcceptedSignal: the actual high-severity core -- a real, accepted
# signal, a real reboot(2), and hypervisor-confirmed evidence (the QEMU process this workflow never
# stops itself exiting on its own) that the guest halted itself. This is the one test here that can
# actually power a guest off; hack/hadron-cleanup.py finding nothing left running for it afterward
# is expected, not a sign cleanup skipped anything.
#
# See docs/contributing/audits/hadron-vm-3-actuator-2026-09-13.md for the design rationale, and
# docs/tasks.md's VM-3 entry for what remains: revoked approval, and the full DaemonSet/RBAC.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  actuator-arms:
    permissions:
      contents: read
    name: Boot Hadron guests and confirm the real actuator arms, rejects, and halts correctly
    runs-on: ubuntu-latest
    # Sum of bounded steps below is 74 minutes; reserve additional cancellation margin.
    timeout-minutes: 82
    steps:
      - name: Clone the code
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Record free disk before installing tooling
        timeout-minutes: 1
        run: df -h /

      # Same install as hadron-vm-boot-smoke.yml. Docker itself is already present on this runner
      # image and is not installed here.
      - name: Install QEMU and genisoimage
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils acl genisoimage

      # Same fix as hadron-vm-probe.yml: /dev/kvm is present but not group/user accessible by
      # default on this runner image. See that workflow's own comment for the full finding.
      - name: Grant KVM device access
        timeout-minutes: 1
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hadron-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo setfacl -m u:"$(whoami)":rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "/dev/kvm is read/write accessible"

      - name: Allocate private smoke state
        timeout-minutes: 1
        run: echo "HADRON_STATE_ROOT=$(mktemp -d "$RUNNER_TEMP/hadron-smoke-XXXXXXXX")" >> "$GITHUB_ENV"

      # GNU timeout bounds compilation, the docker build/save the test performs itself, and the
      # test binary as a whole. TERM permits cooperative cancellation; KILL bounds a hung library
      # call. The Go deadline reserves cleanup time.
      - name: Boot guests, build the real actuator image, and confirm it arms, rejects, and halts correctly
        timeout-minutes: 52
        run: TMPDIR="$HADRON_STATE_ROOT" timeout --signal=TERM --kill-after=15s 51m go test -tags=hadron,hadron_smoke ./test/hadron -run '^TestHadronActuator' -v -timeout=49m

      - name: Stop leftover guests owned by this run
        id: cleanup
        if: always() && env.HADRON_STATE_ROOT != ''
        timeout-minutes: 1
        run: python3 hack/hadron-cleanup.py "$HADRON_STATE_ROOT"

      - name: Dump guest console log on failure
        timeout-minutes: 1
        if: failure()
        run: |
          shopt -s nullglob
          for dir in "$HADRON_STATE_ROOT"/nut-operator-hadron-*; do
            echo "::group::$dir/stdout -- cloud-init/k3s/stage/error lines"
            grep -iE 'cloud-init|k3s|provider-kairos|stage|error|fail|panic|halt gate' "$dir/stdout" 2>/dev/null \
              || echo "(no matching lines, or nothing captured)"
            echo "::endgroup::"
          done

      - name: Upload full guest console log on failure
        timeout-minutes: 3
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hadron-actuator-smoke-console
          path: ${{ env.HADRON_STATE_ROOT }}/nut-operator-hadron-*/std*
          if-no-files-found: warn
          retention-days: 14

      - name: Remove stopped guest state
        if: always() && steps.cleanup.outcome == 'success'
        timeout-minutes: 1
        run: rm -rf -- "$HADRON_STATE_ROOT"

      - name: Record free disk after the run
        timeout-minutes: 1
        if: always()
        run: df -h /

name: Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: michaelzalud18
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nut-operator
            dockerfile: Dockerfile
            context: .
            description: Kubernetes-native power management controller
          - image: nut-server
            dockerfile: images/nut-server/Dockerfile
            context: .
            description: Network UPS Tools server operand
          - image: upsmon-agent
            dockerfile: images/upsmon-agent/Dockerfile
            context: .
            description: Unprivileged Network UPS Tools monitoring agent
          - image: node-actuator
            dockerfile: images/node-actuator/Dockerfile
            context: .
            description: Fail-closed node actuation stub

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: build-metadata
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          # No branch tag and no raw `main` here, deliberately (F-77). This step publishes only
          # immutable references; the floating `main` tag is applied by the promote job below, and
          # only to a digest the e2e suite has run against. Publishing `main` here made the tag mean
          # "built from main" when what anyone pulling it assumes is "tested".
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      # PRs never push, so they get their own single-platform (native runner arch), loadable build
      # scanned *before* anything is published. The old single build step ran push:false across both
      # platforms on PRs too, which builds nothing loadable (a multi-platform manifest list has no
      # single image to `docker load`) and skipped scanning entirely -- PRs got zero vulnerability
      # signal. This closes that gap and drops the wasted arm64/QEMU build on PRs in the process.
      - name: Build image for scanning (pull request)
        id: build-pr
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build-metadata.outputs.created }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            DOCUMENTATION=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/README.md
            LICENSES=Apache-2.0

      - name: Scan pull request image
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          timeout: 10m

      # Non-PR builds (push to main, tags, workflow_dispatch) still build-then-push-then-scan in one
      # multi-platform step: Buildx can't produce a scannable local image for a multi-platform
      # manifest list, so a true pre-push scan would mean either dropping to single-arch here too or
      # scanning each per-platform image separately before assembling the manifest -- meaningfully
      # more machinery for a path that, unlike PRs, is only ever exercised by this repo's own
      # maintainer commits, not external/untrusted changes. The residual risk window (image visible in
      # GHCR for the seconds between push and scan failing the job) is accepted, not unnoticed.
      - name: Build and publish image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build-metadata.outputs.created }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            DOCUMENTATION=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/README.md
            LICENSES=Apache-2.0

      - name: Scan published image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          timeout: 10m

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              images+=("${tag}@${DIGEST}")
            fi
          done <<< "$TAGS"

          cosign sign --yes "${images[@]}"

      - name: Report digest
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ matrix.image }} digest: ${{ steps.build.outputs.digest }}"


  # The operand images are built and scanned individually above, which cannot answer
  # the question F-39 turned on: whether the two of them actually complete a NUT TLS
  # session with the configuration the operator renders. The render tests said yes
  # for months while upsd was rejecting the directive outright, because rendering and
  # protocol behavior were never checked against each other. This job checks them
  # against each other, on one runner, before anything is published.
  nut-tls:
    name: NUT TLS handshake
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Native architecture only and loaded into the daemon: the test has to run the
      # images, and a multi-platform manifest list has nothing to run.
      - name: Build the NUT server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/nut-server/Dockerfile
          push: false
          load: true
          tags: nut-server:tls-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the upsmon agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/upsmon-agent/Dockerfile
          push: false
          load: true
          tags: upsmon-agent:tls-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Negotiate NUT over TLS
        run: hack/nut-tls-smoke.sh docker nut-server:tls-smoke upsmon-agent:tls-smoke

  # Resolves each published image to a digest the gate and the promotion can both name.
  #
  # Matrix legs cannot each contribute a distinct job output -- they all write the same keys and the
  # last leg wins -- so rather than shuttling four digests through artifacts, this reads them back
  # out of the registry. The sha- tag the build job just published is the handle: immutable, one per
  # commit, and already the thing the audit suggested hanging this on. Resolving from the registry
  # also means the digest promoted is provably the digest that is actually there under that tag,
  # rather than a value copied between jobs.
  digests:
    name: Collect digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    outputs:
      nut-operator: ${{ steps.collect.outputs.nut-operator }}
      nut-server: ${{ steps.collect.outputs.nut-server }}
      upsmon-agent: ${{ steps.collect.outputs.upsmon-agent }}
      node-actuator: ${{ steps.collect.outputs.node-actuator }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digests
        id: collect
        env:
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Reconstructs type=sha,prefix=sha-,format=short from the metadata step above, whose short
          # form is the conventional 7 characters. If that convention ever changes, the inspect below
          # fails on a tag that does not exist and nothing is promoted -- the failure is loud and the
          # `main` tag keeps pointing at the last image that did pass.
          tag="sha-${COMMIT_SHA:0:7}"
          for image in nut-operator nut-server upsmon-agent node-actuator; do
            ref="${IMAGE_BASE}/${image}:${tag}"
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{println .Manifest.Digest}}' | head -n1)"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::${ref} did not resolve to a digest: '${digest}'"; exit 1 ;;
            esac
            echo "resolved ${ref} -> ${digest}"
            echo "${image}=${IMAGE_BASE}/${image}@${digest}" >> "$GITHUB_OUTPUT"
          done

  # The gate F-77 was about: the suite runs against the images just published, by digest, and
  # nothing floats the `main` tag until it passes.
  e2e:
    name: E2E gate
    needs: digests
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-e2e.yml
    with:
      manager-image: ${{ needs.digests.outputs.nut-operator }}
      nut-server-image: ${{ needs.digests.outputs.nut-server }}
      upsmon-agent-image: ${{ needs.digests.outputs.upsmon-agent }}
      node-actuator-image: ${{ needs.digests.outputs.node-actuator }}

  # Applies the floating tag to the exact digest the gate ran against.
  #
  # imagetools create adds a tag to an existing manifest rather than rebuilding, so `main` and the
  # `sha-` tag resolve to one digest by construction -- not to two builds that ought to match. No
  # re-signing: cosign signs by digest, so the signature the build job attached already covers this.
  promote:
    name: Promote ${{ matrix.image }} to main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [digests, e2e, nut-tls]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [nut-operator, nut-server, upsmon-agent, node-actuator]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested digest as main
        env:
          SOURCE: ${{ needs.digests.outputs[matrix.image] }}
          TARGET: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:main
        run: |
          set -euo pipefail
          echo "promoting ${SOURCE} to ${TARGET}"
          docker buildx imagetools create --tag "${TARGET}" "${SOURCE}"

name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Unit and envtest suites (K8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Current and two back (F-108). Before this, ENVTEST_K8S_VERSION followed the k8s.io/api
        # minor in go.mod and nothing else, so the whole tested claim rested on exactly one control
        # plane -- the one the operator happened to compile against.
        #
        # 1.34 is here twice over: it is N-2 and it is the version the e2e node image is pinned to,
        # so a break that only shows on the version e2e actually runs cannot hide behind a green
        # unit run on a newer control plane.
        #
        # fail-fast is off because which versions fail is the signal. A single red cell tells you
        # nothing about whether the other two were fine.
        k8s: ["1.34", "1.35", "1.36"]
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache local build tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', '.custom-gcl.yml') }}

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Running Tests
        run: make test ENVTEST_K8S_VERSION=${{ matrix.k8s }}

      # F-111: make test has always written a coverage profile and nothing read it. The total goes
      # in the job summary so a regression is visible without downloading anything, and the profile
      # itself is kept so `go tool cover -html` can be pointed at a specific run.
      - name: Report coverage
        if: matrix.k8s == '1.36'
        run: |
          set -o pipefail
          total="$(make cover | tail -n 1)"
          {
            echo '## Coverage'
            echo
            echo '```'
            echo "$total"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: matrix.k8s == '1.36'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: cover.out
          retention-days: 14

name: Hadron VM Boot Smoke Test

# VM-2's first live boot proof: manually triggered only. VM-1's own probe
# (docs/contributing/audits/hadron-vm-1-feasibility-2026-09-11.md) proved this runner class can
# host a KVM-accelerated guest at all; it deliberately never booted the actual Hadron + k3s
# artifact or ran an install, since that is a slower, artifact-dependent question this workflow
# exists to answer separately. Downloads a real ~400MB artifact and performs a full unattended
# install and reboot, so this must never become a required or automatic check, and must never run
# on every push -- see docs/contributing/audits/hadron-vm-2-peg-evaluation-2026-09-11.md for the
# pinned artifact, checksum provenance, and cloud-config research this exercises for the first
# time against a real guest.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  boot:
    permissions:
      contents: read
    name: Boot one Hadron guest and confirm k3s comes up
    runs-on: ubuntu-latest
    # Sum of bounded steps below is 51 minutes; reserve additional cancellation margin.
    timeout-minutes: 55
    steps:
      - name: Clone the code
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Record free disk before installing tooling
        timeout-minutes: 1
        run: df -h /

      - name: Install QEMU and genisoimage
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils acl genisoimage

      # Same fix as hadron-vm-probe.yml: /dev/kvm is present but not group/user accessible by
      # default on this runner image. See that workflow's own comment for the full finding.
      - name: Grant KVM device access
        timeout-minutes: 1
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hadron-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo setfacl -m u:"$(whoami)":rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "/dev/kvm is read/write accessible"

      - name: Allocate private smoke state
        timeout-minutes: 1
        run: echo "HADRON_STATE_ROOT=$(mktemp -d "$RUNNER_TEMP/hadron-smoke-XXXXXXXX")" >> "$GITHUB_ENV"

      # GNU timeout bounds compilation as well as the test binary. TERM permits cooperative
      # cancellation; KILL bounds a hung library call. The Go deadline reserves cleanup time.
      - name: Boot the pinned Hadron artifact and wait for k3s
        timeout-minutes: 29
        run: TMPDIR="$HADRON_STATE_ROOT" timeout --signal=TERM --kill-after=15s 28m go test -tags=hadron,hadron_smoke ./test/hadron -run TestHadronSingleNodeBoot -v -timeout=26m

      # Stop before uploading artifacts, so slow diagnostics cannot delay process cleanup.
      - name: Stop leftover guests owned by this run
        id: cleanup
        if: always() && env.HADRON_STATE_ROOT != ''
        timeout-minutes: 1
        run: python3 hack/hadron-cleanup.py "$HADRON_STATE_ROOT"

      # TestHadronSingleNodeBoot deliberately does not delete machine state on failure (see its
      # own Cleanup) -- PEG has no separate -serial target, so the guest's -nographic console
      # ends up in this file, and it is the only record of what actually happened during install.
      #
      # A `tail -c 50000` in-log dump was tried first and found unusable: a serial getty
      # repeatedly redrawing its login prompt after boot completes can fill that whole budget by
      # itself, crowding out the cloud-init/k3s startup lines that actually matter, which appear
      # earlier. Grepping across the full file for the lines that matter, plus uploading the
      # complete file as an artifact, replaces guessing at a tail size that happens to be enough.
      - name: Dump guest console log on failure
        timeout-minutes: 1
        if: failure()
        run: |
          shopt -s nullglob
          for dir in "$HADRON_STATE_ROOT"/nut-operator-hadron-*; do
            echo "::group::$dir/stdout -- cloud-init/k3s/stage/error lines"
            grep -iE 'cloud-init|k3s|provider-kairos|stage|error|fail|panic' "$dir/stdout" 2>/dev/null \
              || echo "(no matching lines, or nothing captured)"
            echo "::endgroup::"
          done

      - name: Upload full guest console log on failure
        timeout-minutes: 3
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hadron-boot-smoke-console
          path: ${{ env.HADRON_STATE_ROOT }}/nut-operator-hadron-*/std*
          if-no-files-found: warn
          retention-days: 14

      - name: Remove stopped guest state
        if: always() && steps.cleanup.outcome == 'success'
        timeout-minutes: 1
        run: rm -rf -- "$HADRON_STATE_ROOT"

      - name: Record free disk after the run
        timeout-minutes: 1
        if: always()
        run: df -h /

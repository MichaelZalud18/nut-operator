name: Talos Actuator Smoke Test

# VM-7's milestone 2: qualify the shipped TalosShutdown actuator policy, gated on milestone 1's
# deterministic bring-up (talos-vm-boot-smoke.yml, closed 2026-09-17 -- see
# docs/contributing/audits/talos-vm-7-bootstrap-2026-09-17.md). Reuses test/hadron's own VM-3
# evidence standard against a real Talos node instead of a Linux one: missing/expired/wrong-node
# signals and absent approval must leave the guest running; the approved case's halt is confirmed
# by the guest's own QEMU process exiting on its own, never stopped by this workflow itself.
#
# Each of the three tests below boots and bootstraps its own independent Talos guest (no shared
# state between them, the same isolation test/hadron's own DaemonSet milestone uses), including a
# local ephemeral image registry per guest -- Talos has no SSH and no `ctr images import`
# equivalent, so each locally built image is pushed there and pulled by the guest through a
# registry-mirror redirect baked into its machine configuration before first boot.
#
# Unverified against a real guest as of this writing; the budget below is a first estimate from
# milestone 1's own known wait costs (8m + 5m + 3m + 5m per guest) times three independent guests,
# plus up to five negative-signal subtests at a 4-minute budget each -- expect it to need
# adjustment after a first live run, the same as every other milestone in this session did.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  actuator:
    permissions:
      contents: read
    name: Boot Talos guests and confirm the real TalosShutdown actuator arms, rejects, and halts correctly
    runs-on: ubuntu-latest
    # Sum of bounded steps below is 198 minutes; reserve additional cancellation margin.
    timeout-minutes: 205
    steps:
      - name: Clone the code
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Record free disk before installing tooling
        timeout-minutes: 1
        run: df -h /

      - name: Install QEMU
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      # Pinned against the release's own sha256sum.txt sidecar, the same amd64 build (v1.12.9) the
      # test's own pinned metal-amd64.iso ships, so talosctl and the guest speak the same protocol
      # version.
      - name: Install talosctl
        timeout-minutes: 3
        run: |
          curl -fsSL -o /usr/local/bin/talosctl \
            "https://github.com/siderolabs/talos/releases/download/v1.12.9/talosctl-linux-amd64"
          echo "096edfaea9b5bda6858751d1623a72e017e97f2656772cba0344a752ffc6a572  /usr/local/bin/talosctl" | sha256sum -c -
          chmod +x /usr/local/bin/talosctl

      # Same fix as every other VM smoke workflow: /dev/kvm is present but not group/user
      # accessible by default on this runner image.
      - name: Grant KVM device access
        timeout-minutes: 1
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-talos-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo setfacl -m u:"$(whoami)":rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "/dev/kvm is read/write accessible"

      - name: Allocate private smoke state
        timeout-minutes: 1
        run: echo "TALOS_STATE_ROOT=$(mktemp -d "$RUNNER_TEMP/talos-actuator-smoke-XXXXXXXX")" >> "$GITHUB_ENV"

      # GNU timeout bounds compilation, the four docker builds/pushes and make install/
      # deploy-byo-cert each test performs itself (three times over, once per test -- each test
      # boots its own independent guest and its own local registry), and the test binary as a
      # whole. TERM permits cooperative cancellation; KILL bounds a hung library call. The Go
      # deadline reserves cleanup time.
      - name: Boot guests and confirm the real TalosShutdown actuator arms, rejects, and halts correctly
        timeout-minutes: 172
        run: TMPDIR="$TALOS_STATE_ROOT" timeout --signal=TERM --kill-after=15s 171m go test -tags=talos,talos_smoke ./test/talos -run '^TestTalosActuator' -v -timeout=169m

      # Stop before uploading artifacts, so slow diagnostics cannot delay process cleanup.
      - name: Stop leftover guests owned by this run
        id: cleanup
        if: always() && env.TALOS_STATE_ROOT != ''
        timeout-minutes: 1
        run: python3 hack/talos-cleanup.py "$TALOS_STATE_ROOT"

      - name: Stop leftover local registries owned by this run
        if: always()
        timeout-minutes: 1
        run: |
          ids=$(docker ps -q --filter ancestor=registry:2)
          if [ -n "$ids" ]; then docker stop $ids; fi

      - name: Dump guest console log on failure
        timeout-minutes: 1
        if: failure()
        run: |
          shopt -s nullglob
          for dir in "$TALOS_STATE_ROOT"/nut-operator-talos-*; do
            echo "::group::$dir/stdout"
            grep -iE 'error|fail|panic|talos' "$dir/stdout" 2>/dev/null \
              || echo "(no matching lines, or nothing captured)"
            echo "::endgroup::"
          done

      - name: Upload full guest console log on failure
        timeout-minutes: 3
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-actuator-smoke-console
          path: ${{ env.TALOS_STATE_ROOT }}/nut-operator-talos-*/std*
          if-no-files-found: warn
          retention-days: 14

      - name: Remove stopped guest state
        if: always() && steps.cleanup.outcome == 'success'
        timeout-minutes: 1
        run: rm -rf -- "$TALOS_STATE_ROOT"

      - name: Record free disk after the run
        timeout-minutes: 1
        if: always()
        run: df -h /

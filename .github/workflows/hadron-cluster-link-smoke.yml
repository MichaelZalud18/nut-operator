name: Hadron Cluster Link Smoke Test

# VM-2's inter-guest networking proof: manually triggered only. Two independently booted guests
# have never been shown to actually reach each other -- test/hadron/network.go's ClusterLink/
# ClusterNIC (a raw QEMU socket netdev, listen=/connect= on loopback) is component-tested for
# argument construction only. This workflow boots two live-installer guests (no unattended install,
# no k3s -- deliberately isolating this one new, risky mechanism from everything the single-guest
# boot-smoke workflow already proved) wired by that link, and pings between their kernel-assigned
# IPv6 link-local addresses, which need no guest addressing story at all. Each guest still gets a
# minimal cloud-config (MinimalSSHCloudConfig, no install:/k3s:) purely to create the SSH login
# NewSafeMachine's generated Credentials expect -- a first live run found nothing else creates
# that account, so genisoimage is required here even though the guests never install. See
# docs/contributing/audits/hadron-vm-2-peg-evaluation-2026-09-11.md for why guest static addressing
# on this link is deliberately not attempted yet.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  cluster-link:
    permissions:
      contents: read
    name: Boot two Hadron guests and ping over the cluster link
    runs-on: ubuntu-latest
    # Sum of bounded steps below is 36 minutes; reserve additional cancellation margin.
    timeout-minutes: 40
    steps:
      - name: Clone the code
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Record free disk before installing tooling
        timeout-minutes: 1
        run: df -h /

      # genisoimage is required now: MinimalSSHCloudConfig means both guests get a real
      # cloud-init NoCloud seed ISO built (buildNoCloudISO), unlike this workflow's first
      # version, which had no CloudConfig at all and so never needed it.
      - name: Install QEMU and genisoimage
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils acl genisoimage

      # Same fix as hadron-vm-probe.yml: /dev/kvm is present but not group/user accessible by
      # default on this runner image. See that workflow's own comment for the full finding.
      - name: Grant KVM device access
        timeout-minutes: 1
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hadron-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo setfacl -m u:"$(whoami)":rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "/dev/kvm is read/write accessible"

      - name: Allocate private smoke state
        timeout-minutes: 1
        run: echo "HADRON_STATE_ROOT=$(mktemp -d "$RUNNER_TEMP/hadron-smoke-XXXXXXXX")" >> "$GITHUB_ENV"

      # GNU timeout bounds compilation as well as the test binary, matching
      # hadron-vm-boot-smoke.yml's own reasoning: TERM permits cooperative cancellation, KILL
      # bounds a hung library call, and the Go deadline reserves cleanup time.
      - name: Boot two guests and ping over the cluster link
        timeout-minutes: 14
        run: TMPDIR="$HADRON_STATE_ROOT" timeout --signal=TERM --kill-after=15s 13m go test -tags=hadron,hadron_smoke ./test/hadron -run TestHadronClusterLinkConnectivity -v -timeout=11m

      - name: Stop leftover guests owned by this run
        id: cleanup
        if: always() && env.HADRON_STATE_ROOT != ''
        timeout-minutes: 1
        run: python3 hack/hadron-cleanup.py "$HADRON_STATE_ROOT"

      - name: Dump both guests' console logs on failure
        timeout-minutes: 1
        if: failure()
        run: |
          shopt -s nullglob
          for dir in "$HADRON_STATE_ROOT"/nut-operator-hadron-*; do
            echo "::group::$dir/stdout"
            grep -iE 'error|fail|panic|link|addr' "$dir/stdout" 2>/dev/null \
              || echo "(no matching lines, or nothing captured)"
            echo "::endgroup::"
          done

      - name: Upload full guest console logs on failure
        timeout-minutes: 3
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hadron-cluster-link-smoke-console
          path: ${{ env.HADRON_STATE_ROOT }}/nut-operator-hadron-*/std*
          if-no-files-found: warn
          retention-days: 14

      - name: Remove stopped guest state
        if: always() && steps.cleanup.outcome == 'success'
        timeout-minutes: 1
        run: rm -rf -- "$HADRON_STATE_ROOT"

      - name: Record free disk after the run
        timeout-minutes: 1
        if: always()
        run: df -h /

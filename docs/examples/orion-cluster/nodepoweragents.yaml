  namespace: power-system
  nutServerRefs:
    - name: orion-core
  nodeSelector:
    matchLabels:
      power.example.com/controller: "true"
      power.example.com/power-domain: orion-core
  mode: DryRun
  shutdownFlowRef:
    name: orion-conservation
  upsmon:

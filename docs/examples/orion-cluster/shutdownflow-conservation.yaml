---
apiVersion: power.zalud.io/v1alpha1
kind: ShutdownHook
metadata:
  namespace: power-system
  name: orion-storage-flush
spec:
  invocation:
    transport: HTTP
    timeout: 15s
    http:
      url: https://hooks.example.test/power/orion/storage-flush
      secretHeaders:
        - name: Authorization
          valueFrom:
            namespace: power-system
            name: orion-storage-hook
            key: authorization
      data:
        operation: storage-flush
        site: orion
  dryRun:
    transport: HTTP
    timeout: 5s
    http:
      url: https://hooks.example.test/power/orion/rehearse
      data:
        operation: storage-flush
        rehearsal: "true"
---
apiVersion: power.zalud.io/v1alpha1
kind: ShutdownFlow
metadata:
  name: orion-conservation
spec:
  managementClusterRef:
    name: orion-production
  mode: DryRun
  triggers:
    - type: OnBattery
      powerDomains:
        - orion-core
      for: 2m
    - type: RuntimeBelow
      powerDomains:
        - orion-core
      runtimeBelowSeconds: 1200
  groups:
    - name: burst-capacity
      description: Shed optional burst capacity first.
      action: AgentShutdown
      shutdownTier: 5
      target:
        agentRefs:
          - name: orion-burst
      before:
        - application-workloads
      phase: 0
      timeout: 3m
    - name: application-workloads
      description: Scale ordinary applications before data and storage services.
      action: ScaleWorkload
      shutdownTier: 4
      params:
        replicas: "0"
      target:
        namespaceSelector:
          matchLabels:
            power.example.com/shutdown-group: application
      before:
        - data-workloads
      phase: 10
      timeout: 5m
    - name: data-workloads
      description: Quiesce databases after clients stop.
      action: ScaleWorkload
      shutdownTier: 3
      params:
        replicas: "0"
      target:
        workloadSelector:
          matchLabels:
            power.example.com/shutdown-group: data
      before:
        - storage-services
      phase: 20
      timeout: 10m
    - name: storage-services
      description: Ask external storage to flush after data workloads stop.
      action: RunHook
      shutdownTier: 2
      hookRef:
        namespace: power-system
        name: orion-storage-flush
      before:
        - standard-nodes
      phase: 30
      timeout: 15s
    - name: standard-nodes
      description: Power down standard workers before the controller.
      action: AgentShutdown
      shutdownTier: 2
      target:
        agentRefs:
          - name: orion-standard
      before:
        - controller-node
      phase: 40
      timeout: 5m
    - name: controller-node
      description: Shut down the controller group last for the power domain.
      action: AgentShutdown
      shutdownTier: 1
      target:
        agentRefs:
          - name: orion-controller
      phase: 90
      timeout: 5m
  concurrencyPolicy: Forbid
  abortPolicy:
    behavior: HaltAndSurface
    notify: true
  safety:
    requireManualApproval: true
    approvalAnnotation: power.zalud.io/approved-for-enforce
    maxEstimatedDuration: 45m
